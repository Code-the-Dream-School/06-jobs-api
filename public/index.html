<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recipe App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <form id="login-form" id="username" />
  <input type="password" id="password" />
  <button type="submit">Login</button>
</form>
  <div id="message"></div>

  <div id="recipes">
    <button id="add-recipe">Add Recipe</button>
    <button id="logoff">Log Off</button>
    <table id="recipes-table">
      <thead id="recipes-table-header">
        <tr>
          <th>Name</th>
          <th>Ingredients</th>
          <th>Method</th>
          <th>Difficulty</th>
          <th>Prep Time</th>
          <th>Vegetarian</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="edit-recipe">
    <h2 id="form-title">Add/Edit Recipe</h2>
    <p id="message"></p>

    <label for="recipe">Recipe Name:</label>
    <input type="text" id="recipe" />

    <label for="ingredients">Ingredients:</label>
    <textarea id="ingredients"></textarea>

    <label for="method">Method:</label>
    <textarea id="method"></textarea>

    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>
    
    <label for="prepTime">Preparation Time (mins):</label>
    <input type="number" id="prepTime" />
    
    <label>
      <input type="checkbox" id="isVegetarian" />
      Vegetarian
    </label>

    <button id="adding-recipe">Save</button>
    <button id="edit-cancel">Cancel</button>
  </div>
  <script type="module" src="index.js"></script>
  <script src="recipes.js" defer></script>
</body>
</html>
